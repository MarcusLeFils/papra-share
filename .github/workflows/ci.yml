name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write        # pour publier la release et le tag
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────── CI — à chaque push/PR ─────────────
  test-lint-build:
    name: Test · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Environnement Nix (déclaratif via flake.nix) : JDK, SDK Android, Gradle.
      - uses: DeterminateSystems/nix-installer-action@v4

      # Le signingConfig exige PAPRA_* à la config même pour test/lint (qui ne
      # signent pas). On fournit un placeholder inoffensif ici ; seuls le job
      # release fournit les secrets réels.
      - name: Provide signing placeholders (no-op for CI/test)
        run: |
          mkdir -p .signing
          cat > .signing/keystore.env <<'EOF'
          PAPRA_KEY_ALIAS=ci
          PAPRA_KEYSTORE=/nonexistent/ci.jks
          PAPRA_KEY_PASSWORD=ci
          PAPRA_KEYSTORE_PASSWORD=ci
          EOF

      - name: Enter devShell and run unit tests (Nix)
        run: nix develop --command ./gradlew test --no-daemon

      - name: Lint
        run: nix develop --command ./gradlew lintDebug --no-daemon

      - name: Build debug APK
        run: nix develop --command ./gradlew assembleDebug --no-daemon

  # ───────────── Release — tag v* uniquement ─────────────
  release:
    name: Release (signed APK)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-lint-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v4

      # La keystore (secrète) et sa saisie sont fournies par les secrets GitHub,
      # jamais par le dépôt : on écrit .signing/keystore.env à la volée.
      - name: Restore signing keystore from secrets
        env:
          PAPRA_KEYSTORE_B64: ${{ secrets.PAPRA_KEYSTORE_B64 }}
          PAPRA_KEY_PASSWORD: ${{ secrets.PAPRA_KEY_PASSWORD }}
          PAPRA_KEYSTORE_PASSWORD: ${{ secrets.PAPRA_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p .signing
          if [ -z "$PAPRA_KEYSTORE_B64" ]; then
            echo "::error::Secret PAPRA_KEYSTORE_B64 is not set — contactez MarcusLeFils."
            exit 1
          fi
          # keystore déchiffrée et protégée (jamais dans l'historique)
          echo "$PAPRA_KEYSTORE_B64" | base64 -d > .signing/papra-share-release.jks
          chmod 600 .signing/papra-share-release.jks
          cat > .signing/keystore.env <<EOF
          PAPRA_KEY_ALIAS=papra
          PAPRA_KEYSTORE=$PWD/.signing/papra-share-release.jks
          PAPRA_KEY_PASSWORD=$PAPRA_KEY_PASSWORD
          PAPRA_KEYSTORE_PASSWORD=$PAPRA_KEYSTORE_PASSWORD
          EOF
          chmod 600 .signing/keystore.env

      - name: Build signed release APK
        run: nix develop --command ./gradlew assembleRelease --no-daemon

      - name: Verify signature (apksigner)
        run: |
          # apksigner est fourni par les build-tools du SDK ; java est dans le devShell.
          nix develop --command bash -c '
            APK="$PWD/app/build/outputs/apk/release/app-release.apk"
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
            [ -n "$APKSIGNER" ] || { echo "::error::apksigner introuvable"; exit 1; }
            "$APKSIGNER" verify --verbose "$APK"
            if ! "$APKSIGNER" verify --verbose "$APK" | grep -q "Verified using v2 scheme.*true"; then
              echo "::error::signature v2 non vérifiée"; exit 1
            fi
          '

      - name: Generate changelog (git-cliff, config par défaut)
        run: |
          nix run nixpkgs#git-cliff -- --latest > /tmp/release-notes.md

      - name: Tag name and artifacts
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk \
             "/tmp/papra-share-v${VERSION}-signed.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "${{ github.ref_name }}"
          body_path: /tmp/release-notes.md
          files: /tmp/papra-share-v${{ steps.meta.outputs.version }}-signed.apk
          draft: false
          prerelease: false