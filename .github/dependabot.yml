version: 2
updates:
  # Dépendances Gradle (AGP, Kotlin, libs Android…) via gradle/libs.versions.toml
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Actions GitHub utilisées dans ci.yml (checkout, nix-installer, action-gh-release)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5