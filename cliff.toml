# git-cliff — configuration du changelog (https://git-cliff.org)
# Génération : git-cliff -o CHANGELOG.md --latest (ou git-cliff sans options)
[changelog]
header = """
# Changelog

Toutes les modifications notables de Papra Share sont documentées ici.

Le format est fondé sur [Keep a Changelog](https://keepachangelog.com/),
et le projet adhère à la [Semantic Versioning](https://semver.org/).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\
{% endif %}\
"""
template = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Fonctionnalités" },
    { message = "^fix", group = "Corrections de bugs" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^build|^ci|^chore", group = "Build & CI" },
    { message = "^test", group = "Tests" },
]
replace_breaking_dash_with_commas = true